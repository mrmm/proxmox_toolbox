---
# Ansible inventory for Proxmox servers
# Copy this file and customize for your environment

all:
  children:
    proxmox:
      children:
        proxmox_ve:
          hosts:
            pve1.example.com:
              ansible_host: 192.168.1.10
            pve2.example.com:
              ansible_host: 192.168.1.11
            pve3.example.com:
              ansible_host: 192.168.1.12

        proxmox_backup:
          hosts:
            pbs1.example.com:
              ansible_host: 192.168.1.20

      vars:
        ansible_user: root
        ansible_python_interpreter: /usr/bin/python3

        # Common Proxmox settings
        proxmox_enable_no_subscription: true
        proxmox_disable_enterprise: true
        proxmox_enable_fail2ban: true

    # Proxmox 7 servers (legacy)
    proxmox_7:
      hosts:
        pve7-legacy.example.com:
          ansible_host: 192.168.1.30
      vars:
        proxmox_version: 7
        proxmox_distribution: bullseye

    # Proxmox 8 servers
    proxmox_8:
      hosts:
        pve8-prod.example.com:
          ansible_host: 192.168.1.40
      vars:
        proxmox_version: 8
        proxmox_distribution: bookworm

    # Proxmox 9 servers
    proxmox_9:
      hosts:
        pve9-test.example.com:
          ansible_host: 192.168.1.50
      vars:
        proxmox_version: 9
        proxmox_distribution: bookworm
