---
# Configure PBS repositories for version >= 4 (using .sources format)

- name: Check if proxmox.sources already exists
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/proxmox.sources
  register: _proxmox_sources_file

- name: Create no-subscription sources file for PBS
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/proxmox.sources
    content: |
      Types: deb
      URIs: http://download.proxmox.com/debian/pbs
      Suites: {{ _proxmox_distribution }}
      Components: pbs-no-subscription
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
    mode: '0644'
  when:
    - proxmox_enable_no_subscription | bool
    - not _proxmox_sources_file.stat.exists

- name: Disable PBS enterprise repository (backup .sources file)
  ansible.builtin.command:
    cmd: mv /etc/apt/sources.list.d/pbs-enterprise.sources /etc/apt/sources.list.d/pbs-enterprise.sources.BAK
  args:
    creates: /etc/apt/sources.list.d/pbs-enterprise.sources.BAK
    removes: /etc/apt/sources.list.d/pbs-enterprise.sources
  when: proxmox_disable_enterprise | bool

- name: Check for old no-subscription entry in sources.list
  ansible.builtin.shell: |
    grep -q '^[[:space:]]*deb http://download.proxmox.com/debian/pbs' /etc/apt/sources.list
  register: _old_nosub_check
  changed_when: false
  failed_when: false

- name: Comment out old no-subscription entry in sources.list
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list
    regexp: '^([[:space:]]*)deb http://download\.proxmox\.com/debian/pbs'
    line: '# \1deb http://download.proxmox.com/debian/pbs {{ _proxmox_distribution }} pbs-no-subscription'
    backrefs: true
  when: _old_nosub_check.rc == 0

- name: Suggest modernizing sources after upgrade
  ansible.builtin.debug:
    msg: "!! Old no-subscription repo detected. Consider running 'apt modernize-sources' manually !!"
  when:
    - _old_nosub_check.rc == 0
    - proxmox_suggest_modernize | bool

- name: Remove old .list source files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/pbs-enterprise.list
  when: proxmox_cleanup_old_sources | bool
