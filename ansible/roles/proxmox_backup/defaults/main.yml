---
# defaults file for proxmox_backup

# Backup configuration
proxmox_backup_enabled: false
proxmox_backup_dir: "/root/proxmox_config_backups"
proxmox_backup_retention_days: 30

# Paths to backup
proxmox_backup_paths:
  - /etc/ssh/sshd_config
  - /root/.ssh/
  - /etc/fail2ban/
  - /etc/systemd/system/*.mount
  - /etc/network/interfaces
  - /etc/sysctl.conf
  - /etc/resolv.conf
  - /etc/hosts
  - /etc/hostname
  - /etc/cron*
  - /etc/aliases
  - /etc/snmp/
  - /etc/smartd.conf
  - /usr/share/snmp/snmpd.conf
  - /etc/postfix/
  - /etc/pve/
  - /etc/lvm/
  - /etc/modprobe.d/
  - /var/lib/pve-firewall/
  - /var/lib/pve-cluster/
  - /etc/corosync/authkey
  - /etc/vzdump.conf
  - /etc/ksmtuned.conf
  - /etc/proxmox-backup/

# Restore configuration
proxmox_restore_enabled: false
proxmox_restore_archive: ""  # Path to backup archive to restore
proxmox_restore_network: true  # Whether to restore network configuration
